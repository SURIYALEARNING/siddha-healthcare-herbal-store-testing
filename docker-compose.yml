version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: ecommerce-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    # Important: Only expose internally, not to public
    ports:
      - "127.0.0.1:27017:27017"  # Only localhost access

  # Backend API
  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      # Add your other env vars here (Stripe, Razorpay, etc.)
    depends_on:
      - mongodb
    networks:
      - ecommerce-network
    # Expose only internally
    expose:
      - "5000"

  # Frontend
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - ecommerce-network
    ports:
      - "80:80"  # Expose to internet (if using public) OR use reverse proxy

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongodb_data: