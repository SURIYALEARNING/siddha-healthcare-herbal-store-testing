version: '3.8'

# Runs alongside siddha-clinic-pdf-generator on the SAME VPS.
# Ports used: 8080 (frontend nginx, HTTP). PDF stack uses 8081.
# HTTPS is terminated by a host-level nginx reverse proxy (see deploy/).
# Database: MongoDB Atlas (no bundled mongodb).

services:
  # Backend API
  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-https://ecommerce.lakshmihealthcarecentrerockfort.com}
      MONGODB_ATLES: ${MONGODB_ATLES}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD}
      SHIPROCKET_PICKUP_LOCATION: ${SHIPROCKET_PICKUP_LOCATION:-primary}
      SHIPROCKET_PICKUP_PINCODE: ${SHIPROCKET_PICKUP_PINCODE:-600001}
      SHIPROCKET_DEFAULT_WEIGHT: ${SHIPROCKET_DEFAULT_WEIGHT:-0.5}
    networks:
      - ecommerce-network
    # Expose only internally (frontend nginx proxies to it)
    expose:
      - "5000"

  # Frontend (React build served by nginx)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    container_name: ecommerce-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - ecommerce-network
    # HTTP only - HTTPS is terminated by the host-level nginx (deploy/)
    # Bind to loopback only; host nginx proxies 443 -> 127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:80"

networks:
  ecommerce-network:
    driver: bridge
