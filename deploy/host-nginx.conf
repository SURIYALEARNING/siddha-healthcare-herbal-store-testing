# Host-level reverse proxy - owns ports 80/443 on the VPS and routes to the
# two docker apps by domain. SSL is terminated ONLY here.
#
# Install: cp deploy/host-nginx.conf /etc/nginx/sites-available/lhcc
#          ln -s /etc/nginx/sites-available/lhcc /etc/nginx/sites-enabled/lhcc
#          nginx -t && systemctl reload nginx
# (Live for both domains, managed by the host; do not run certbot in Docker.)
#
# Upstreams:
#   PDF app nginx      -> http://127.0.0.1:8081  (siddha-clinic-pdf-generator, docker)
#   Store app nginx    -> http://127.0.0.1:8080  (siddha-healthcare-herbal-store, docker)

# NOTE: disable any docker nginx that published host 80/443 so this config owns them.
# The siddha-clinic-pdf-generator nginx must NOT publish 443 - use 127.0.0.1:8081:80.

# ---- Siddha Clinic PDF Generator ----
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name lhccpdf.lakshmihealthcarecentrerockfort.com;
    return 301 https://$host$request_uri;
}

# HTTPS -> PDF docker nginx on 127.0.0.1:8081
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lhccpdf.lakshmihealthcarecentrerockfort.com;

    ssl_certificate     /etc/letsencrypt/live/lhccpdf.lakshmihealthcarecentrerockfort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lhccpdf.lakshmihealthcarecentrerockfort.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- Ecommerce Herbal Store ----
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ecommerce.lakshmihealthcarecentrerockfort.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> ecommerce docker nginx on 127.0.0.1:8080
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ecommerce.lakshmihealthcarecentrerockfort.com;

    ssl_certificate     /etc/letsencrypt/live/ecommerce.lakshmihealthcarecentrerockfort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.lakshmihealthcarecentrerockfort.com/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}