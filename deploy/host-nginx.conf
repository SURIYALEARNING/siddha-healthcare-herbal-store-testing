# Host-level reverse proxy - owns ports 80/443 on the VPS and routes to the
# two docker apps by domain.
#
# Install: cp deploy/host-nginx.conf /etc/nginx/sites-available/lhcc
#          ln -s /etc/nginx/sites-available/lhcc /etc/nginx/sites-enabled/lhcc
#          nginx -t && systemctl reload nginx
# Then run certbot to enable HTTPS for both domains:
#          certbot --nginx -d lhccpdf.lakshmihealthcarecentrerockfort.com -d store.lakshmihealthcarecentrerockfort.com -d ecommerce.lakshmihealthcarecentrerockfort.com
#
# Upstreams:
#   PDF app nginx      -> http://127.0.0.1:8081  (siddha-clinic-pdf-generator, docker)
#   Store app nginx    -> http://127.0.0.1:8080  (siddha-healthcare-herbal-store, docker)

# ---- Siddha Clinic PDF Generator ----
server {
    listen 80;
    server_name lhccpdf.lakshmihealthcarecentrerockfort.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- Siddha Healthcare Herbal Store ----
